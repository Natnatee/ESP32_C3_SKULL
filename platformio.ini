[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = espressif32
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
build_src_filter = +<main.cpp>
board_build.mcu = esp32c3
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

[env:pir_led_test]
extends = env:esp32c3
build_src_filter = +<pir_led_test.cpp>
